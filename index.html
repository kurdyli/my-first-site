<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Мой первый сайт</title>
</head>

<body>
  <main class="app-card">
    <h1>Моя гостевая книга</h1>
    <p class="intro">Напишите сообщение — оно сохранится в Python и SQLite.</p>

    <button id="hello-button" type="button">Проверить JavaScript</button>

    <form id="message-form">
      <label for="message-input">Новое сообщение</label>
      <div class="form-row">
        <input
          id="message-input"
          name="message"
          type="text"
          maxlength="200"
          placeholder="Например: Привет, это моё сообщение!"
          required
        >
        <button type="submit">Отправить</button>
      </div>
    </form>

    <p id="form-status" class="status" aria-live="polite"></p>

    <section class="messages-section" aria-labelledby="messages-title">
      <h2 id="messages-title">Сообщения</h2>
      <ul id="messages-list"></ul>
    </section>
  </main>

  <script>
    const button = document.getElementById("hello-button");
    const form = document.getElementById("message-form");
    const input = document.getElementById("message-input");
    const submitButton = form.querySelector('button[type="submit"]');
    const status = document.getElementById("form-status");
    const messagesList = document.getElementById("messages-list");

    button.addEventListener("click", () => {
      alert("Привет! JavaScript работает.");
    });

    async function loadMessages() {
      const response = await fetch("/api/messages");

      if (!response.ok) {
        throw new Error("Не удалось загрузить сообщения");
      }

      const messages = await response.json();
      messagesList.innerHTML = "";

      for (const message of messages) {
        const item = document.createElement("li");
        item.textContent = `${message.text} — ${message.author}`;
        messagesList.append(item);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) {
        return;
      }

      submitButton.disabled = true;
      status.textContent = "Сохраняем сообщение...";

      try {
        const response = await fetch("/api/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });

        if (!response.ok) {
          throw new Error("Не удалось сохранить сообщение");
        }

        input.value = "";
        status.textContent = "Сообщение сохранено в SQLite.";
        await loadMessages();
      } catch (error) {
        status.textContent = "Не удалось сохранить сообщение. Попробуйте ещё раз.";
        console.error(error);
      } finally {
        submitButton.disabled = false;
      }
    });

    loadMessages().catch((error) => {
      status.textContent = "Не удалось загрузить сообщения.";
      console.error(error);
    });
  </script>
</body>
</html>
